<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="rbac-matrix.svg">

<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="roughShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="3" dy="4" stdDeviation="0.5" flood-color="#111827" flood-opacity="0.08"/>
  </filter>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #fffefe; stroke: #1a1a2e; stroke-width: 3; stroke-linejoin: round; filter: url(#roughShadow); }
    .box2 { fill: #fff1f2; stroke: #be123c; stroke-width: 3; stroke-linejoin: round; filter: url(#roughShadow); }
    .soft { fill: #f9fafb; stroke: #1a1a2e; stroke-width: 2.5; stroke-linejoin: round; filter: url(#roughShadow); }
    .text { font-family: 'Virgil', 'Comic Sans MS', 'Segoe UI', Arial, sans-serif; fill: #1a1a2e; font-size: 28px; font-weight: 700; }
    .small { font-family: 'Virgil', 'Comic Sans MS', 'Segoe UI', Arial, sans-serif; fill: #374151; font-size: 18px; font-weight: 600; }
    .tiny { font-family: 'Virgil', 'Comic Sans MS', 'Segoe UI', Arial, sans-serif; fill: #4b5563; font-size: 15px; }
    .label { font-family: 'Virgil', 'Comic Sans MS', 'Segoe UI', Arial, sans-serif; fill: #be123c; font-size: 19px; font-weight: 800; }
    .line { fill: none; stroke: #1a1a2e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .line-red { fill: none; stroke: #be123c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
    .dash { fill: none; stroke: #6b7280; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 8; }
    .mono { font-family: 'Consolas', 'Monaco', monospace; fill: #111827; font-size: 17px; }
  </style>
</defs>

<rect class="bg" width="100%" height="100%"/>

<text class="label" x="70" y="55">RBAC: permissão por papel</text>
<rect class="box" x="70" y="90" width="1060" height="470" rx="20"/>
<line x1="70" y1="170" x2="1130" y2="170" stroke="#1a1a2e" stroke-width="3"/>
<line x1="330" y1="90" x2="330" y2="560" stroke="#1a1a2e" stroke-width="3"/>
<line x1="570" y1="90" x2="570" y2="560" stroke="#1a1a2e" stroke-width="2"/>
<line x1="810" y1="90" x2="810" y2="560" stroke="#1a1a2e" stroke-width="2"/>
<line x1="70" y1="250" x2="1130" y2="250" stroke="#d1d5db" stroke-width="2"/>
<line x1="70" y1="330" x2="1130" y2="330" stroke="#d1d5db" stroke-width="2"/>
<line x1="70" y1="410" x2="1130" y2="410" stroke="#d1d5db" stroke-width="2"/>
<line x1="70" y1="490" x2="1130" y2="490" stroke="#d1d5db" stroke-width="2"/>

<text class="small" x="120" y="140">Ação</text>
<text class="small" x="410" y="140">USER</text>
<text class="small" x="642" y="140">MODERATOR</text>
<text class="small" x="900" y="140">ADMIN</text>

<text class="small" x="110" y="220">Ver próprio perfil</text>
<text class="text" x="430" y="222">✓</text><text class="text" x="675" y="222">✓</text><text class="text" x="930" y="222">✓</text>
<text class="small" x="110" y="300">Editar próprio perfil</text>
<text class="text" x="430" y="302">✓</text><text class="text" x="675" y="302">✓</text><text class="text" x="930" y="302">✓</text>
<text class="small" x="110" y="380">Moderar conteúdo</text>
<text class="text" x="435" y="382">×</text><text class="text" x="675" y="382">✓</text><text class="text" x="930" y="382">✓</text>
<text class="small" x="110" y="460">Gerenciar usuários</text>
<text class="text" x="435" y="462">×</text><text class="text" x="680" y="462">×</text><text class="text" x="930" y="462">✓</text>
<text class="small" x="110" y="535">Apagar sistema</text>
<text class="text" x="435" y="535">×</text><text class="text" x="680" y="535">×</text><text class="text" x="935" y="535">?</text>

</svg>