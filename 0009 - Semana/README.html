<h2 id="o-que-falta-para-o-blog-existir">O que falta para o blog existir</h2>
<p>Na Semana 5 vocês <strong>consumiram</strong> uma API: o navegador pedia, alguém respondia.</p>
<p>Quem escreve o lado que <strong>responde</strong>?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>navegador  --requisicao--&gt;  ??????  --resposta--&gt;  navegador
                           um programa ouvindo uma porta
</code></pre>
<p>Esse programa é o <strong>backend</strong> do blog. Pra escrevê-lo, precisamos de:</p>
<ol>
<li>uma <strong>linguagem</strong> — JavaScript/TypeScript, que vocês já conhecem</li>
<li>um <strong>runtime</strong> — o programa que executa essa linguagem no servidor</li>
</ol>
<div class="nota">
JavaScript sozinho não roda em servidor nenhum.
Ele precisa de um runtime — e é aí que o Bun entra.
</div>

<h2 id="o-que-%C3%A9-um-runtime">O que é um runtime?</h2>
<p>JavaScript é só uma <strong>especificação</strong>. Quem executa o código é uma <strong>engine</strong>:</p>
<table>
<thead>
<tr>
<th>Engine</th>
<th>Quem usa</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>V8</strong> (Google)</td>
<td>Chrome, Node.js</td>
</tr>
<tr>
<td><strong>JavaScriptCore</strong> (Apple)</td>
<td>Safari, <strong>Bun</strong></td>
</tr>
</tbody>
</table>
<p>A engine só executa o programa. O <strong>runtime</strong> é a engine <strong>+ as APIs</strong> que o código usa para falar com o mundo externo: arquivos, rede, sistema.</p>
<div class="nota">
Analogia: a engine é o motor. O runtime é o carro inteiro —
motor, mais tudo o que faz o motor ser útil.
</div>
</section>

<h2 id="mesma-linguagem-mundos-diferentes">Mesma linguagem, mundos diferentes</h2>
<table>
<thead>
<tr>
<th>Onde roda</th>
<th>O que o JavaScript enxerga</th>
</tr>
</thead>
<tbody>
<tr>
<td>Navegador</td>
<td><code>window</code>, <code>fetch</code>, DOM, <code>localStorage</code> (Semana 3)</td>
</tr>
<tr>
<td>Node.js</td>
<td><code>process</code>, <code>node:fs</code>, <code>node:http</code></td>
</tr>
<tr>
<td><strong>Bun</strong></td>
<td>as APIs Web <strong>e</strong> as do Node</td>
</tr>
</tbody>
</table>
<p>O runtime define <strong>qual mundo</strong> o seu código enxerga.</p>

<h2 id="o-que-o-bun-substitui">O que o Bun substitui</h2>
<table>
<thead>
<tr>
<th>Ferramenta que você já ouviu falar</th>
<th>No Bun</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>node</code></td>
<td><code>bun run</code></td>
</tr>
<tr>
<td><code>npm</code></td>
<td><code>bun install</code></td>
</tr>
<tr>
<td><code>jest</code></td>
<td><code>bun test</code></td>
</tr>
<tr>
<td><code>tsc</code> / <code>tsx</code> (rodar TypeScript)</td>
<td><strong>não precisa — é nativo</strong></td>
</tr>
</tbody>
</table>
<p>Quatro ferramentas, um executável só.</p>
<div class="nota">
O Bun foi escrito em Zig e C++, sobre a engine JavaScriptCore.
O Node roda sobre a V8. Engines diferentes, propostas iguais.
</div>

<h2 id="por-que-bun--para-n%C3%B3s-agora">Por que Bun — para nós, agora</h2>
<ol>
<li><strong>TypeScript sem configuração</strong> — <code>.ts</code> roda direto. Zero build, zero <code>tsconfig</code></li>
<li><strong>Servidor HTTP nativo</strong> — <code>Bun.serve</code> faz o trabalho do Express <strong>sem instalar nada</strong></li>
<li><strong>Rápido</strong> — o processo Bun inicia ~4x mais rápido que o Node (<code>5.2ms</code> vs <code>25.1ms</code> no hello world da documentação)</li>
<li><strong>Nivelamento</strong> — todo mundo começa igual: um binário, zero dependências, um arquivo</li>
</ol>
<div class="nota">
Ponto 4 é o mais importante hoje: sem dependência instalada,
não existe "na minha máquina não roda".
</div>
</section>

<h2 id="response-%C3%A9-api-web--nada-novo">Response é API Web — nada novo</h2>
<p><code>Bun.serve</code> não usa <code>req</code>/<code>res</code> como o Express. Usa <strong><code>Request</code> e <code>Response</code></strong> — os mesmos objetos do <code>fetch</code> do navegador.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">new</span> <span class="hljs-title class_">Response</span>(<span class="hljs-string">&quot;texto&quot;</span>)                        <span class="hljs-comment">// 200 implícito</span>
<span class="hljs-keyword">new</span> <span class="hljs-title class_">Response</span>(<span class="hljs-string">&quot;não achei&quot;</span>, { <span class="hljs-attr">status</span>: <span class="hljs-number">404</span> })  <span class="hljs-comment">// status explícito</span>
<span class="hljs-title class_">Response</span>.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">ok</span>: <span class="hljs-literal">true</span> })                  <span class="hljs-comment">// JSON com 200</span>
<span class="hljs-title class_">Response</span>.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">criado</span>: <span class="hljs-literal">true</span> }, { <span class="hljs-attr">status</span>: <span class="hljs-number">201</span> })
</code></pre>
<table>
<thead>
<tr>
<th>No Express você escreveria</th>
<th>No Bun</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>res.send(&quot;ok&quot;)</code></td>
<td><code>new Response(&quot;ok&quot;)</code></td>
</tr>
<tr>
<td><code>res.status(404).json({...})</code></td>
<td><code>Response.json({...}, { status: 404 })</code></td>
</tr>
<tr>
<td>body parser no meio</td>
<td><code>await req.json()</code> — nativo</td>
</tr>
</tbody>
</table>
<div class="nota">
É o fetch que vocês conhecem, espelhado para o lado do servidor.
</div>
</section>

<h2 id="o-bun-j%C3%A1-traz-o-test-runner">O Bun já traz o test runner</h2>
<p>Lembra do &quot;kit completo, um binário só&quot;? Isso inclui os testes:</p>
<ul>
<li>test runner <strong>nativo</strong> — nada de instalar o Jest</li>
<li>compatível com a API do Jest (<code>test</code>, <code>expect</code>)</li>
<li>TypeScript direto, sem configuração</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">bun <span class="hljs-built_in">test</span>                <span class="hljs-comment"># roda todos os testes</span>
bun <span class="hljs-built_in">test</span> --watch        <span class="hljs-comment"># reexecuta a cada save</span>
</code></pre>
<p>O runner procura automaticamente arquivos chamados <strong><code>*.test.ts</code></strong>.</p>

<h2 id="test-e-expect--a-anatomia">test e expect — a anatomia</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;cria um post com id&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-comment">//      ^ nome: o que o teste garante</span>
  <span class="hljs-title function_">expect</span>(<span class="hljs-title function_">criarPost</span>(<span class="hljs-string">&quot;titulo&quot;</span>)).<span class="hljs-title function_">toBe</span>(<span class="hljs-number">42</span>);
  <span class="hljs-comment">// ^ expect(valor).afirmacao(valorEsperado)</span>
});
</code></pre>
<table>
<thead>
<tr>
<th>Peça</th>
<th>Papel</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>test(nome, fn)</code></td>
<td>um caso: &quot;isso deveria acontecer&quot;</td>
</tr>
<tr>
<td><code>expect(x)</code></td>
<td>pega um valor para afirmar algo sobre ele</td>
</tr>
<tr>
<td><code>.toBe(y)</code></td>
<td>afirmação: igual a <code>y</code></td>
</tr>
<tr>
<td><code>.toEqual(y)</code></td>
<td>igualdade <strong>profunda</strong> — para objetos e arrays</td>
</tr>
</tbody>
</table>
<div class="nota">
Nomes importam: o nome do teste é a descrição do que quebrou
quando ele falha. "deveria rejeitar post sem título" &gt; "teste 3".
</div>

<h2 id="o-que-tdd-significa">O que TDD significa</h2>
<p><strong>TDD = Test-Driven Development.</strong> Desenvolvimento guiado por testes.</p>
<p>A ordem tradicional:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. escrever o código
2. escrever o teste
3. rodar e torcer
</code></pre>
<p>A ordem do TDD — <strong>invertida</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. escrever o teste        (para um código que não existe)
2. rodar -&gt; FALHA          (vermelho — e falhar é o objetivo)
3. escrever o código
4. rodar -&gt; PASSA          (verde)
5. refatorar, rodando de novo
</code></pre>
<div class="nota">
Parece ao contrário. É ao contrário — de propósito.
O teste é a primeira especificação do que o código deve fazer.
</div>
</section>

<h2 id="vermelho---verde---refatora">Vermelho -&gt; Verde -&gt; Refatora</h2>
<p>O ciclo do TDD tem nome: <strong>Red, Green, Refactor</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>   1. RED       escreva o TESTE e o veja FALHAR
                (o código ainda não existe)

   2. GREEN     escreva o código MÍNIMO para passar

   3. REFACTOR  melhore o design — o teste protege

        ^______ volta ao 1 (próximo teste)
</code></pre>
<div class="nota">
Um ciclo por vez, passos pequenos.
Nunca dois ciclos sem rodar os testes.
</div>

<h2 id="por-que-codar-assim">Por que codar assim</h2>
<ol>
<li><strong>o teste falha primeiro</strong> — você vê o teste falhar e depois passar; se ele falhar por outro motivo depois, você percebe</li>
<li><strong>código nascido testável</strong> — código escrito para ser testado é mais simples, mais isolado, menos engessado</li>
<li><strong>a especificação virou executável</strong> — o que o código deve fazer está escrito no teste, não num comentário</li>
<li><strong>coragem pra mudar</strong> — o teste avisa na hora se a mudança quebrou algo</li>
</ol>
<div class="nota">
Ponto 4 é o que nos permite chegar na Semana 13:
trocar banco, refazer rota, mexer em tudo — sem medo.
</div>

<h2 id="refactoring--a-palavra-de-martin-fowler">Refactoring — a palavra de Martin Fowler</h2>
<blockquote>
<p>&quot;<strong>Refatorar</strong>: mudar a estrutura interna do software<br />
<strong>sem mudar o comportamento externo</strong>,<br />
para deixá-lo mais fácil de entender e mais barato de modificar.&quot;</p>
</blockquote>
<p>Refactoring <strong>não é</strong> reescrever, <strong>não é</strong> otimizar, <strong>não é</strong> corrigir bug.</p>
<p>É: o código funciona, mas está feio/confuso/duplicado — você melhora a forma, <strong>e o comportamento continua idêntico</strong>.</p>
<div class="nota">
Como você prova que o comportamento não mudou?
Os testes continuam verdes. É isso que eles garantem.
</div>

<h2 id="como-o-teste-protege-o-refactoring">Como o teste protege o refactoring</h2>
<p>Sem teste, refatorar é fé:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>mexi num arquivo ... o resto ainda funciona?  acho que sim?
</code></pre>
<p>Com teste:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>refatorou -&gt; bun test -&gt; 12 pass  -&gt; garantido, nada quebrou
</code></pre>
<div class="nota">
No TDD, refatorar é seguro porque os testes são a rede de segurança:
se a estrutura interna mudar e um comportamento quebrar,
o teste falha na hora — e diz qual quebrou.
</div>

<h2 id="tdd-na-pr%C3%A1tica--o-que-vamos-fazer">TDD na prática — o que vamos fazer</h2>
<p>Vamos aplicar o ciclo em uma função <strong>pura</strong>, antes das rotas:</p>
<ol>
<li>a lógica dos posts (<code>criar</code>, <code>buscar</code>, <code>atualizar</code>, <code>remover</code>) vive em funções separadas, testáveis</li>
<li>as rotas do CRUD ficam finas: chamam a lógica e devolvem a <code>Response</code></li>
<li><strong>a lógica nasce por TDD</strong>; as rotas vocês testam com <code>curl</code> (por hoje)</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>index.ts          -&gt;  rotas (HTTP)          -&gt; teste com curl
posts.ts          -&gt;  lógica (regras)       -&gt; teste com bun test
</code></pre>
<div class="nota">
Essa separação é o primeiro design de verdade do blog.
E é ela que permite trocar o array pelo Prisma na
Semana 10 sem tocar nas rotas.
</div>

<table>

<td>listar todos</td>
</tr>
<tr>
<td><code>GET</code></td>
<td><code>/api/posts/:id</code></td>
<td>abrir um post</td>
</tr>
<tr>
<td><code>PUT</code></td>
<td><code>/api/posts/:id</code></td>
<td>editar um post</td>
</tr>
<tr>

<td>apagar um post</td>

<h2 id="o-crud-agora-nasce-por-tdd">O CRUD agora nasce por TDD</h2>
<p>Cada operação da lógica, <strong>um ciclo RED -&gt; GREEN -&gt; REFACTOR</strong>:</p>
<table>
<thead>
<tr>
<th>Ciclo</th>
<th>Teste que nasce primeiro (RED)</th>
<th>Código mínimo (GREEN)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><code>listarPosts</code> devolve o que existe</td>
<td><code>posts</code> vazio -&gt; <code>[]</code></td>
</tr>
<tr>
<td>2</td>
<td><code>buscarPostPorId</code> acha pelo id</td>
<td><code>posts.find(...)</code></td>
</tr>
<tr>
<td>3</td>
<td><code>buscarPostPorId</code> com id inventado -&gt; <code>undefined</code></td>
<td>idem (sem if!)</td>
</tr>
<tr>
<td>4</td>
<td><code>atualizarPost</code> muda o título e mantém o resto</td>
<td><code>??</code> preserva campos</td>
</tr>
<tr>
<td>5</td>
<td><code>removerPost</code> tira do array</td>
<td><code>posts.splice(...)</code></td>
</tr>
</tbody>
</table>
<div class="nota">
Ciclo 3 é o espírito do TDD: escreva o teste do
caso "não encontrado" ANTES de existir o if que o trata.
</div>

<h2 id="sintaxe-nova-handlers-por-m%C3%A9todo">Sintaxe nova: handlers por método</h2>
<p>No <code>routes</code>, uma mesma URL aceita um objeto <strong>por método HTTP</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-attr">routes</span>: {
  <span class="hljs-string">&quot;/api/posts&quot;</span>: {
    <span class="hljs-attr">GET</span>:  <span class="hljs-function">() =&gt;</span> <span class="hljs-title class_">Response</span>.<span class="hljs-title function_">json</span>(posts),
    <span class="hljs-attr">POST</span>: <span class="hljs-title function_">async</span> (req) =&gt; { <span class="hljs-comment">/* criar */</span> },
  },
},
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>GET  /api/posts   -&gt;  roda o GET
POST /api/posts   -&gt;  roda o POST
</code></pre>
<p>REST literal: a URL decide <strong>o recurso</strong>, o método decide <strong>a operação</strong>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-string">&quot;/api/posts/:id&quot;</span>: <span class="hljs-function">(<span class="hljs-params">req</span>) =&gt;</span> {

},
</code></pre>
<ul>
<li><code>:id</code> é um <strong>coringa</strong>: casa com qualquer valor naquela posição</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-string">&quot;/api/posts/:id&quot;</span>: <span class="hljs-function">(<span class="hljs-params">req</span>) =&gt;</span> {

<p>Em <code>posts.ts</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">removerPost</span>(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span></span>): <span class="hljs-built_in">boolean</span> {

  posts.<span class="hljs-title function_">splice</span>(index, <span class="hljs-number">1</span>);
  <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;

<div class="nota">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>POST   -&gt; 201

GET um  -&gt; 200 ou 404

</code></pre>
<p>Depois, <strong>teste os erros de propósito</strong>:</p>
<ul>
<li>POST sem <code>titulo</code> — sua API deixa criar? Deveria?</li>
<li>GET com id inventado — responde 404 bonito?</li>
</ul>
<div class="nota">
API boa não é só a que funciona com entrada certa.
É a que se comporta bem com entrada errada.
E amanhã, quando alguém refatorar algo, é a que
o <code>bun test</code> continua verde.
</div>

<h2 id="a-imagem-oficial-do-bun">A imagem oficial do Bun</h2>
<p>O Bun mantém uma imagem Docker pública, no Docker Hub:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">docker pull oven/bun:1
</code></pre>
<ul>
<li><code>oven/bun</code> — imagem oficial, da equipe do Bun</li>
<li><code>1</code> — a versão major do Bun (mesma lógica do <code>node:lts</code> da Semana 3)</li>
</ul>
<p>Ela já vem com <strong>o binário <code>bun</code> inteiro</strong> dentro: runtime, transpiler, tudo.</p>
<div class="nota">
Analogia da oficina continua valendo: a imagem base é a
massa de pizza pronta. Nós só colocamos o recheio —
que hoje é um único arquivo.
</div>

<h2 id="o-dockerfile-inteiro">O Dockerfile inteiro</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dockerfile"><span class="hljs-keyword">FROM</span> oven/bun:<span class="hljs-number">1</span>

<span class="hljs-keyword">WORKDIR</span><span class="language-bash"> /usr/src/app</span>

<span class="hljs-keyword">COPY</span><span class="language-bash"> index.ts posts.ts types.ts ./</span>

<span class="hljs-keyword">USER</span> bun
<span class="hljs-keyword">EXPOSE</span> <span class="hljs-number">3000</span>/tcp
<span class="hljs-keyword">ENTRYPOINT</span><span class="language-bash"> [<span class="hljs-string">&quot;bun&quot;</span>, <span class="hljs-string">&quot;run&quot;</span>, <span class="hljs-string">&quot;index.ts&quot;</span>]</span>
</code></pre>
<p>Nove linhas — e os testes <strong>não entram na imagem</strong> (<code>.dockerignore</code> cuida disso, adiante). Vamos ler uma por uma.</p>

<h2 id="from-e-workdir">FROM e WORKDIR</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dockerfile"><span class="hljs-keyword">FROM</span> oven/bun:<span class="hljs-number">1</span>

<span class="hljs-keyword">WORKDIR</span><span class="language-bash"> /usr/src/app</span>
</code></pre>
<p><strong><code>FROM</code></strong> — a base: um sistema com o Bun pronto.<br />
Você não começa do zero, começa de algo que já funciona.</p>
<p><strong><code>WORKDIR</code></strong> — o diretório de trabalho dentro da imagem.<br />
Cria se não existir; tudo o que vier depois roda a partir dele.<br />
Equivale a um <code>cd</code> que fica valendo daqui em diante.</p>

<h2 id="copy--o-momento-em-que-o-c%C3%B3digo-entra">COPY — o momento em que o código entra</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dockerfile"><span class="hljs-keyword">COPY</span><span class="language-bash"> index.ts posts.ts types.ts ./</span>
</code></pre>
<p>Copia do <strong>seu computador</strong> para dentro da <strong>imagem</strong>.</p>
<ul>
<li>origem: seus arquivos, relativo à pasta onde roda o <code>docker build</code> (o <strong>contexto de build</strong>)</li>
<li>destino: <code>./</code> — que aqui é <code>/usr/src/app</code>, por causa do <code>WORKDIR</code></li>
</ul>
<div class="nota">
Lembre da oficina: o código não fica "no Dockerfile".
O Dockerfile só tem instruções — e o COPY é a instrução
que traz o código para dentro.
</div>

<h2 id="um-detalhe-que-o-bun-j%C3%A1-resolve-por-n%C3%B3s">Um detalhe que o Bun já resolve por nós</h2>
<p>O erro nº 1 da oficina: servidor ouvindo em <code>localhost</code> <strong>dentro do container</strong> — ninguém de fora alcança.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// Node clássico — o container sobe, a porta não responde</span>
server.<span class="hljs-title function_">listen</span>(<span class="hljs-number">3000</span>, <span class="hljs-string">&quot;localhost&quot;</span>);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-comment">// Bun — o padrão do Bun.serve é 0.0.0.0</span>
<span class="hljs-title class_">Bun</span>.<span class="hljs-title function_">serve</span>({ <span class="hljs-attr">port</span>: <span class="hljs-number">3000</span>, <span class="hljs-attr">routes</span>: { <span class="hljs-comment">/* ... */</span> } });  <span class="hljs-comment">// nasce certo</span>
</code></pre>
<p><code>0.0.0.0</code> = &quot;aceite conexões de qualquer interface&quot;.</p>
<div class="nota">
O Bun escolheu o padrão certo para servidores.
Quem usa Node é que precisa lembrar disso manualmente.

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>node_modules

Dockerfile*
docker-compose*
.dockerignore
.git
.gitignore
README.md
.env

<li><strong><code>.env</code> nunca vai para dentro da imagem</strong> — segredo não se empacota</li>
</ul>

arquivo de segredo fora do container.

<li>o container é <strong>efêmero</strong> — removeu o container, removeu a camada de escrita (Semana 3)</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>estado que precisa sobreviver  -&gt;  não pode viver no processo
                              -&gt;  precisa viver FORA: um banco de dados
</code></pre>
<div class="nota">
Essa "falha" de hoje é a motivação inteira da Semana 10:
o array vira PostgreSQL + Prisma, dentro e fora do container.
</div>

<h2 id="o-que-vimos-hoje">O que vimos hoje</h2>
<p><strong>Bun</strong></p>
<ul>
<li>runtime all-in-one: runtime + pacotes + testes + bundler, um binário</li>
<li>engine JavaScriptCore; TypeScript nativo, zero config</li>
<li><code>Bun.serve</code>: rotas por método HTTP, sem framework</li>
</ul>
<p><strong>Testes, TDD e Refactoring</strong></p>
<ul>
<li><code>bun test</code> nativo, arquivos <code>*.test.ts</code></li>
<li>TDD: RED -&gt; GREEN -&gt; REFACTOR — o teste nasce antes do código</li>
<li>refactoring (Fowler): muda a estrutura, mantém o comportamento — provado pelos testes verdes</li>
</ul>
<p><strong>CRUD e Docker</strong></p>
<ul>
<li>POST 201, GET 200/404, PUT 200/404, DELETE 204</li>
<li>lógica testada (<code>posts.ts</code>) + rotas finas (<code>index.ts</code>)</li>
<li><code>FROM oven/bun:1</code>, ciclo editar -&gt; build -&gt; run</li>
</ul>

<h2 id="desafio-da-semana-9">Desafio da Semana 9</h2>
<p><strong>Iniciante</strong> — CRUD de <strong>tarefas</strong> (<code>/api/tarefas</code>) com <code>titulo</code> e <code>feita</code> (boolean), <strong>um ciclo TDD por operação</strong>: escreva o teste, veja falhar, faça passar. Teste as rotas com <code>curl</code>.</p>
<p><strong>Intermediário</strong> — adicione validação <strong>test-first</strong>: escreva primeiro o teste &quot;rejeita tarefa sem titulo&quot; (<code>.toBeUndefined()</code> no retorno, ou o erro que decidirem), depois o código. Depois <code>GET /api/tarefas?busca=texto</code> filtrando por título — teste primeiro, claro.</p>
<p><strong>Avançado</strong> — refactor: extraia a busca e a validação para funções puras próprias (<code>*.ts</code> separados), <strong>mantendo todos os testes verdes sem editá-los</strong>. Depois porta via variável de ambiente: <code>process.env.PORT</code> no <code>Bun.serve</code>, <code>docker run -e PORT=4000 -p 4000:4000</code>.</p>
<div class="nota">
Repare no desafio avançado: refactoring é MUDAR a estrutura
e NÃO MUDAR os testes. Se você precisou editar o teste
para o código compilar, não foi refactor — foi reescrita.
</div>
</section>

<p>O array vira banco de verdade:</p>
<ul>

<p>E aqui o TDD paga: trocar o array pelo Prisma é <strong>um refactoring gigante</strong> —<br />
as funções de <code>posts.ts</code> mudam por dentro, os testes e as rotas ficam.<br />
Se os testes continuarem verdes, a troca é segura.</p>
<p>O design que vocês escreveram hoje <strong>não muda</strong>.<br />

  margin-bottom: 0.3em;
}

h3 {
  font-size: 22px;
  font-weight: 700;
  color: #be123c;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0.8em 0 0.3em;
}

p {
  margin: 0.35em 0;
}

strong {
  color: #1a1a2e;
  font-weight: 700;
}

em {
  color: #6b7280;
}

code {
  background: #f3f4f6;
  color: #9d174d;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.88em;
  font-family: 'Consolas', 'Courier New', monospace;
  font-weight: 600;
}

pre {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-left: 4px solid #be123c;
  padding: 10px 16px;
  border-radius: 0 6px 6px 0;
  font-size: 17px;
  line-height: 1.3;
  margin: 0.5em 0;
}

pre code {
  background: transparent;
  color: #111827;
  padding: 0;
  font-size: 1em;
  font-weight: 400;
}

blockquote {
  background: #fff1f2;
  border-left: 4px solid #be123c;
  color: #4b5563;
  padding: 8px 16px;
  border-radius: 0 6px 6px 0;
  margin: 0.7em 0;
  font-style: normal;
  font-size: 0.9em;
}

ul, ol {
  padding-left: 1.3em;
  margin: 0.25em 0;
}

li {
  margin-bottom: 0.35em;
}

table {
  font-size: 18px;
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.5em;
}

th {
  background: #1a1a2e;
  color: #ffffff;
  padding: 6px 10px;
  text-align: left;
  font-weight: 600;
  font-size: 0.8em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

td {
  background: #ffffff;
  padding: 6px 10px;
  border-bottom: 1px solid #e5e7eb;
  color: #374151;
  vertical-align: top;
}

tr:nth-child(even) td {
  background: #f9fafb;
}

.nota {
  font-size: 0.85em;
  color: #4b5563;
  background: #fff1f2;
  border-left: 4px solid #be123c;
  padding: 8px 16px;
  border-radius: 0 6px 6px 0;
  margin-top: 0.8em;
}

section.cover {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: #ffffff;
  border-top: 6px solid #be123c;
}

section.cover h1 {
  font-size: 52px;
  border: none;
  padding: 0;
  margin-bottom: 0.15em;
  line-height: 1.15;
}

section.cover h2 {
  color: #be123c;
  font-size: 0.95rem;
  letter-spacing: 0.14em;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 1em;
}

section.cover p {
  color: #6b7280;
  font-size: 0.95rem;
}
